note: >-
  Two domains. The Config plane is a tenancy hierarchy (Organization > Project > ...).
  The data plane is the Identity Knowledge Graph (IKG): Nodes connected by typed Relationships,
  each carrying Properties, operated on via the Capture and ContX IQ APIs.
