concurrency_control:
  style: optimistic
  mechanism: ETag / If-Match
  detail: Config API objects return an `etag`; conditional updates/deletes send `If-Match` and fail with 412 Precondition Failed on a stale etag.
  applies_to: Config API (configs/v1) resource mutations
idempotency:
  supported: false
  note: No Idempotency-Key header is documented; write safety on the Config API is provided by ETag/If-Match optimistic concurrency (412 on conflict), not idempotency keys.
pagination:
  documented: false
  note: List endpoints (e.g. listProjects, listApplications) return collections directly; no cursor/page-token pagination parameters are declared in the OpenAPI. A `search` query parameter filters some Config collections.
versioning:
  scheme: uri-path
  current: v1
  detail: Data-plane paths are versioned (/capture/v1, /access/v1, /contx-iq/v1, /data-schema/v1); Config API is served under /configs/v1.
