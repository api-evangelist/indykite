aid: indykite
name: Indykite
description: >-
  IndyKite is the runtime control layer for agentic AI. Its enterprise platform applies trust,
  context, and runtime control across organizational data so autonomous AI agents can act securely,
  continuously injecting live signals — identity, provenance, freshness, sensitivity, and compliance
  status — into AI actions and access decisions at the moment they occur. The platform is built on an
  Identity Knowledge Graph (IKG) and delivers Knowledge-Based Access Control (KBAC), AuthZEN-based
  authorization, ContX IQ contextual queries, entity matching, and a hosted regional Model Context
  Protocol (MCP) server. IndyKite exposes a REST API (Capture, DataSchema, ContX IQ, AuthZEN, Entity
  Matching) and a Config API for managing organizations, projects, applications, app agents, service
  accounts, authorization policies, knowledge queries, event sinks, and MCP servers, plus a Go SDK and
  a Terraform provider. Added to the API Evangelist network via the speedinvest portfolio and enriched
  from the provider's public OpenAPI and documentation.
